<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagina non trovata | LD Technologies SRL</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#05070d">
  <!-- Su GitHub Pages il sito sta in /nome-repository/: la base va calcolata per far funzionare i percorsi relativi -->
  <script>document.write('<base href="' + location.pathname.split('/').slice(0, /github\.io$/.test(location.hostname) ? 2 : 1).join('/') + '/">')</script>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: #05070d radial-gradient(circle at 75% 20%, rgba(52,225,162,.16), transparent 55%), radial-gradient(circle at 15% 85%, rgba(247,198,0,.12), transparent 55%); color: #eef1f8; font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; text-align: center; }
    main { max-width: 34rem; }
    h1 { margin: 0 0 .4em; font-size: clamp(5rem, 22vw, 9rem); line-height: .9; letter-spacing: -.04em; background: linear-gradient(135deg, #f7c600, #34e1a2); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { margin: 0 0 .5em; font-size: clamp(1.3rem, 4vw, 1.8rem); }
    p { color: #a1abc3; margin: 0 0 1.6rem; }
    a.btn { display: inline-flex; align-items: center; min-height: 2.9rem; padding: .8rem 1.7rem; border-radius: 999px; background: #34e1a2; color: #05070d; font-weight: 800; text-decoration: none; box-shadow: 0 10px 40px -10px #34e1a2; }
    a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Questa pagina non esiste.</h2>
    <p>Il link potrebbe essere errato o la pagina potrebbe essere stata spostata. Torna alla home di LD Technologies SRL.</p>
    <a class="btn" href="./">Torna alla home</a>
  </main>
</body>
</html>
