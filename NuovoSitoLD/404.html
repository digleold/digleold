<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagina non trovata | LD Technologies SRL</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">
  <!-- Su GitHub Pages il sito sta in /nome-repository/: la base va calcolata per far funzionare i percorsi relativi -->
  <script>document.write('<base href="' + location.pathname.split('/').slice(0, /github\.io$/.test(location.hostname) ? 2 : 1).join('/') + '/">')</script>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: #fff; color: #0a0a0a; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; text-align: center; -webkit-font-smoothing: antialiased; }
    main { max-width: 38rem; }
    h1 { margin: 0 0 .1em; font-size: clamp(6rem, 26vw, 13rem); line-height: .85; letter-spacing: -.06em; font-weight: 600; }
    h2 { margin: 0 0 .6em; font-size: clamp(1.3rem, 4vw, 2rem); letter-spacing: -.04em; font-weight: 500; }
    p { color: #4f4f4f; margin: 0 0 1.8rem; }
    a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.6rem; border-radius: 999px; background: #0a0a0a; color: #fff; font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Questa pagina non esiste.<br><span style="color:#686973">This page does not exist.</span></h2>
    <p>Il link potrebbe essere errato o la pagina potrebbe essere stata spostata. · The link may be wrong or the page may have moved.</p>
    <a class="btn" href="./">Torna alla home</a> <a class="btn" href="en/" style="background:transparent;color:#0a0a0a;border:1px solid #cfcfd4">Back to home</a>
  </main>
</body>
</html>
